# EXPECT: cleanup with status [success, failure] is ALSO skipped, workflow=success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  check:
    image: alpine
    commands:
      - exit 78
    signals:
      skip: 78

  build:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN"

  cleanup:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN (cleanup)"
    when:
      - status: [success, failure]
