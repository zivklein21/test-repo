# EXPECT: cleanup with status [success, failure] is ALSO skipped, workflow=success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     06-cleanup-also-skipped
        SIGNALS:  skip: 78
        EXPECT:   cleanup with status [success, failure] is ALSO skipped, workflow=success
    commands:
      - echo "$${DESCRIPTION}"

  check:
    image: alpine
    commands:
      - exit 78
    signals:
      skip: 78

  build:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN"

  cleanup:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN (cleanup)"
    when:
      - status: [success, failure]
