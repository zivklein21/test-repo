# EXPECT: check=success, build skipped (grey), workflow=success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     12-plugin-step-skipped
        SIGNALS:  skip: 78
        EXPECT:   check=success, build skipped (grey), workflow=success
    commands:
      - echo "$${DESCRIPTION}"

  check:
    image: alpine
    commands:
      - exit 78
    signals:
      skip: 78

  build:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN"
