# EXPECT: app-a cancels itself (KILLED, build never runs); app-b builds (success) -> cancel only affects its own workflow
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

matrix:
  include:
    - NAME: app-a
      CANCEL: "true"
    - NAME: app-b
      CANCEL: "false"

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     matrix-09-cancel-one-entry
        SIGNALS:  cancel: 70
        MATRIX:   NAME=${NAME} CANCEL=${CANCEL}
        EXPECT:   app-a cancels itself (KILLED, build never runs); app-b builds (success)
               -> cancel only affects its own workflow
    commands:
      - echo "$${DESCRIPTION}"

  check:
    image: alpine
    commands:
      - if [ "${CANCEL}" = "true" ]; then exit 70; fi
    signals:
      cancel: 70

  build:
    image: alpine
    commands:
      - echo "build ${NAME}"
