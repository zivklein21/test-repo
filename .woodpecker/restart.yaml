# RESTART pipeline: runs when restart.txt changes (or on manual run).
# Each step tests one restart case, all run in parallel after `describe`.
# The workflow ends red on purpose (two steps fail after their last attempt).
labels:
  skip78: "true"

when:
  - event: push
    path: restart.txt
  - event: manual

skip_clone: true

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        PIPELINE: restart signal
        STEPS (run in parallel):
          restart-default        restart: 75                  always exits 75 -> 3 attempts (attempt 3 of 3) -> FAILURE
          restart-max-1          max_restarts: 1              always exits 75 -> 2 attempts (attempt 2 of 2) -> FAILURE
          restart-max-5-passes   max_restarts: 5              exits 76 on attempts 1-3, passes on attempt 4 -> green
          restart-not-needed     max_restarts: 3              exits 0 at once -> 1 attempt, no restart marker -> green
        LOGS: a "--- woodpecker: step sent restart signal, starting attempt N of M ---" line
              between attempts, line numbers keep counting.
        WORKFLOW: red (restart-default and restart-max-1 fail on purpose)
    commands:
      - echo "$${DESCRIPTION}"

  restart-default:
    image: alpine
    commands:
      - n=$$(cat .attempts-default 2>/dev/null || echo 0); n=$$((n+1)); echo $$n > .attempts-default; echo "attempt $$n"
      - exit 75
    signals:
      restart: 75
    depends_on: [describe]

  restart-max-1:
    image: alpine
    commands:
      - n=$$(cat .attempts-max1 2>/dev/null || echo 0); n=$$((n+1)); echo $$n > .attempts-max1; echo "attempt $$n"
      - exit 75
    signals:
      restart:
        exit_codes: 75
        max_restarts: 1
    depends_on: [describe]

  restart-max-5-passes:
    image: alpine
    commands:
      - n=$$(cat .attempts-max5 2>/dev/null || echo 0); n=$$((n+1)); echo $$n > .attempts-max5; echo "attempt $$n"
      - if [ "$$n" -lt 4 ]; then echo "flaky network"; exit 76; fi
      - echo "worked on attempt $$n"
    signals:
      restart:
        exit_codes: [75, 76]
        max_restarts: 5
    depends_on: [describe]

  restart-not-needed:
    image: alpine
    commands:
      - echo "all good the first time"
    signals:
      restart:
        exit_codes: 75
        max_restarts: 3
    depends_on: [describe]
