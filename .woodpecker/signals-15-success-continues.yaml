# EXPECT: lint exits 1 (mapped to success) -> lint green, build RUNS, workflow=success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     15-success-continues
        SIGNALS:  success: 1
        EXPECT:   lint exits 1 (mapped to success)
               -> lint green, build RUNS, workflow=success
    commands:
      - echo "$${DESCRIPTION}"

  lint:
    image: alpine
    commands:
      - echo "only warnings -> exit 1"
      - exit 1
    signals:
      success: 1

  build:
    image: alpine
    commands:
      - echo "build RUNS"
