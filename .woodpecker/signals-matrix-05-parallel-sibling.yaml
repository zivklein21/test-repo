# EXPECT: per entry: tests (parallel, slow) finish; package skipped when SKIP=true; all success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

matrix:
  include:
    - NAME: app-a
      SKIP: "true"
    - NAME: app-b
      SKIP: "false"

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     matrix-05-parallel-sibling
        SIGNALS:  skip: 78
        MATRIX:   NAME=${NAME} SKIP=${SKIP}
        EXPECT:   per entry: tests (parallel, slow) finish; package skipped when SKIP=true; all success
    commands:
      - echo "$${DESCRIPTION}"
    depends_on: []

  check:
    image: alpine
    commands:
      - if [ "${SKIP}" = "true" ]; then exit 78; fi
    signals:
      skip: 78
    depends_on: [describe]

  tests:
    image: alpine
    commands:
      - sleep 2
      - echo "tests for ${NAME} finished"
    depends_on: [describe]

  package:
    image: alpine
    commands:
      - echo "package ${NAME}"
    depends_on: [check, tests]
