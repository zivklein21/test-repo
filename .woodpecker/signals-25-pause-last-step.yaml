# EXPECT: pause in the last stage -> nothing left to wait for, workflow does NOT pause, success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     25-pause-last-step
        SIGNALS:  pause: 71
        EXPECT:   pause in the last stage
               -> nothing left to wait for, workflow does NOT pause, success
    commands:
      - echo "$${DESCRIPTION}"

  build:
    image: alpine
    commands:
      - echo "build"

  approve:
    image: alpine
    commands:
      - exit 71
    signals:
      pause: 71
