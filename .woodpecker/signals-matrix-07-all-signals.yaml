# EXPECT per entry: CODE=0 build runs | 1 success->build runs | 78 skip->build skipped | 75 restart x3 then FAILURE | 9 unmapped FAILURE
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

matrix:
  CODE:
    - 0
    - 1
    - 78
    - 75
    - 9

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     matrix-07-all-signals
        SIGNALS:  restart: 75, skip: 78, success: 1
        MATRIX:   CODE=${CODE}
        EXPECT:   per matrix entry:
                  CODE=0 build runs
                  1 success->build runs
                  78 skip->build skipped
                  75 restart x3 then FAILURE
                  9 unmapped FAILURE
    commands:
      - echo "$${DESCRIPTION}"

  check:
    image: alpine
    commands:
      - echo "exiting with ${CODE}"
      - exit ${CODE}
    signals:
      success: 1
      skip: 78
      restart: 75

  build:
    image: alpine
    commands:
      - echo "build for CODE=${CODE}"
