# EXPECT: lint fails with failure: ignore, then skip -> build skipped, workflow=success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     10-failure-ignore-then-skip
        SIGNALS:  skip: 78
        EXPECT:   lint fails with failure: ignore, then skip
               -> build skipped, workflow=success
    commands:
      - echo "$${DESCRIPTION}"

  lint:
    image: alpine
    commands:
      - exit 1
    failure: ignore

  check:
    image: alpine
    commands:
      - exit 78
    signals:
      skip: 78

  build:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN"
