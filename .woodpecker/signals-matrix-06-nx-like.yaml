# EXPECT: app-a: check green, build+push skipped (grey). app-b: affected, build+push run. all workflows success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

matrix:
  include:
    - NAME: app-a
    - NAME: app-b

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     matrix-06-nx-like
        SIGNALS:  skip: 78
        MATRIX:   NAME=${NAME}
        EXPECT:   app-a: check green, build+push skipped (grey). app-b: affected, build+push run. all workflows success
    commands:
      - echo "$${DESCRIPTION}"
    depends_on: []

  check-affected:
    image: alpine
    commands:
      # real pipeline: npx nx show projects --affected --base=$${CI_PREV_COMMIT_SHA} --type app > affected.txt
      - echo "app-b" > affected.txt
      - grep -qx "${NAME}" affected.txt || { echo "${NAME} not affected"; exit 78; }
      - echo "${NAME} affected"
    signals:
      skip: 78

  build:
    image: alpine
    commands:
      - echo "building ${NAME}"
    depends_on: [check-affected]

  push:
    image: alpine
    commands:
      - echo "pushing ${NAME}"
    depends_on: [build]
