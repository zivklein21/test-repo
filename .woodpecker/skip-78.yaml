# THE TEST: first exits 78 -> expected: first green, second grey, workflow green
labels:
  skip78: "true"

skip_clone: true

when:
  - event: [push, manual]

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     skip-78
        SIGNALS:  skip: 78
        EXPECT:   first green, second grey (skipped), workflow green
    commands:
      - echo "$${DESCRIPTION}"

  first:
    image: alpine:3.20
    commands:
      - echo "not affected, exiting with 78"
      - exit 78
    signals:
      skip: 78

  second:
    image: alpine:3.20
    commands:
      - echo "IF YOU SEE THIS, THE SKIP DID NOT WORK"