# EXPECT: slow sibling (parallel) finishes successfully, after-both skipped, workflow=success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     07-running-sibling-finishes
        SIGNALS:  skip: 78
        EXPECT:   slow sibling (parallel) finishes successfully, after-both skipped, workflow=success
    commands:
      - echo "$${DESCRIPTION}"
    depends_on: []

  check:
    image: alpine
    commands:
      - exit 78
    signals:
      skip: 78
    depends_on: [describe]

  slow-sibling:
    image: alpine
    commands:
      - sleep 3
      - echo "sibling FINISHED"
    depends_on: [describe]

  after-both:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN"
    depends_on: [check, slow-sibling]
