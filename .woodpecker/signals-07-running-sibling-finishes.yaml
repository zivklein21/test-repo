# EXPECT: slow sibling (parallel) finishes successfully, after-both skipped, workflow=success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  check:
    image: alpine
    commands:
      - exit 78
    signals:
      skip: 78
    depends_on: []

  slow-sibling:
    image: alpine
    commands:
      - sleep 3
      - echo "sibling FINISHED"
    depends_on: []

  after-both:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN"
    depends_on: [check, slow-sibling]
