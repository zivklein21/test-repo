# EXPECT: check=success, build+deploy=skipped, workflow=success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     01-skip-single-code
        SIGNALS:  skip: 78
        EXPECT:   check=success, build+deploy=skipped, workflow=success
    commands:
      - echo "$${DESCRIPTION}"

  check:
    image: alpine
    commands:
      - echo "not affected -> exit 78"
      - exit 78
    signals:
      skip: 78

  build:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN"

  deploy:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN"
