# EXPECT: flaky fails attempt 1 (exit 75), passes attempt 2 -> flaky green, build RUNS, workflow=success. Log shows 'attempt 2 of 3'
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  flaky:
    image: alpine
    commands:
      - n=$$(cat .attempts-18 2>/dev/null || echo 0); n=$$((n+1)); echo $$n > .attempts-18; echo "attempt $$n"
      - if [ "$$n" -lt 2 ]; then echo "network error"; exit 75; fi
      - echo "worked on attempt $$n"
    signals:
      restart: 75

  build:
    image: alpine
    commands:
      - echo "build RUNS"
