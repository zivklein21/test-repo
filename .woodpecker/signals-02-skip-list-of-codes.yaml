# EXPECT: check exits 79 (in list) -> build skipped, workflow=success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     02-skip-list-of-codes
        SIGNALS:  skip: [78, 79]
        EXPECT:   check exits 79 (in list)
               -> build skipped, workflow=success
    commands:
      - echo "$${DESCRIPTION}"

  check:
    image: alpine
    commands:
      - exit 79
    signals:
      skip: [78, 79]

  build:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN"
