# EXPECT: app-a builds; app-b and app-c: check green, build skipped; ALL workflows success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

matrix:
  NAME:
    - app-a
    - app-b
    - app-c

steps:
  check-affected:
    image: alpine
    commands:
      - echo "app-a" > affected.txt
      - grep -qx "${NAME}" affected.txt || { echo "${NAME} not affected"; exit 78; }
      - echo "${NAME} affected"
    signals:
      skip: 78

  build:
    image: alpine
    commands:
      - echo "building ${NAME}"

  push:
    image: alpine
    commands:
      - echo "pushing ${NAME}"
