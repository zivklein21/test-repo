# EXPECT: always exits 75 -> runs 3 times, then fails with exit 75, workflow=FAILURE
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     19-restart-limit
        SIGNALS:  restart: 75
        EXPECT:   always exits 75
               -> runs 3 times, then fails with exit 75, workflow=FAILURE
    commands:
      - echo "$${DESCRIPTION}"

  always-flaky:
    image: alpine
    commands:
      - n=$$(cat .attempts-19 2>/dev/null || echo 0); n=$$((n+1)); echo $$n > .attempts-19; echo "attempt $$n"
      - exit 75
    signals:
      restart: 75

  build:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN"
