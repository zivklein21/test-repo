# EXPECT: attempt 1 exit 75 (restart), attempt 2 exit 78 (skip) -> check green, build skipped, workflow=success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  check:
    image: alpine
    commands:
      - n=$$(cat .attempts-20 2>/dev/null || echo 0); n=$$((n+1)); echo $$n > .attempts-20; echo "attempt $$n"
      - if [ "$$n" -lt 2 ]; then exit 75; fi
      - exit 78
    signals:
      restart: 75
      skip: 78

  build:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN"
