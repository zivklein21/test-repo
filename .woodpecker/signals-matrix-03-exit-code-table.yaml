# EXPECT: CODE=0 -> build runs; 78,79 -> build skipped (success); 1 -> FAILURE; 80 (unmapped) -> FAILURE
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

matrix:
  CODE:
    - 0
    - 78
    - 79
    - 1
    - 80

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     matrix-03-exit-code-table
        SIGNALS:  skip: [78, 79]
        MATRIX:   CODE=${CODE}
        EXPECT:   CODE=0
               -> build runs; 78,79
               -> build skipped (success); 1
               -> FAILURE; 80 (unmapped)
               -> FAILURE
    commands:
      - echo "$${DESCRIPTION}"

  check:
    image: alpine
    commands:
      - echo "exiting with ${CODE}"
      - exit ${CODE}
    signals:
      skip: [78, 79]

  build:
    image: alpine
    commands:
      - echo "build for CODE=${CODE}"
