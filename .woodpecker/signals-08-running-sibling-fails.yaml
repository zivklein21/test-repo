# EXPECT: slow sibling fails after skip -> workflow=FAILURE, after-both skipped
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     08-running-sibling-fails
        SIGNALS:  skip: 78
        EXPECT:   slow sibling fails after skip
               -> workflow=FAILURE, after-both skipped
    commands:
      - echo "$${DESCRIPTION}"
    depends_on: []

  check:
    image: alpine
    commands:
      - exit 78
    signals:
      skip: 78
    depends_on: [describe]

  slow-sibling:
    image: alpine
    commands:
      - sleep 3
      - exit 1
    depends_on: [describe]

  after-both:
    image: alpine
    commands:
      - echo "SHOULD NOT RUN"
    depends_on: [check, slow-sibling]
