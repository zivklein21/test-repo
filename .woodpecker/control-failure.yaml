# CONTROL: normal failure -> expected: first red, second grey, workflow red
labels:
  skip78: "true"

skip_clone: true

when:
  - event: [push, manual]

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     control-failure
        SIGNALS:  -
        EXPECT:   first red, second grey, workflow red (normal failure, no signals)
    commands:
      - echo "$${DESCRIPTION}"

  first:
    image: alpine:3.20
    commands:
      - echo "failing on purpose"
      - exit 1

  second:
    image: alpine:3.20
    commands:
      - echo "should not run after a failure"