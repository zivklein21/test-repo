# EXPECT: each entry has its own counter; app-a passes on attempt 2, app-b on attempt 3, app-c never (FAILURE after 3)
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

matrix:
  include:
    - NAME: app-a
      PASS_ON: 2
    - NAME: app-b
      PASS_ON: 3
    - NAME: app-c
      PASS_ON: 9

steps:
  deploy:
    image: alpine
    commands:
      - n=$$(cat .attempts-${NAME} 2>/dev/null || echo 0); n=$$((n+1)); echo $$n > .attempts-${NAME}; echo "${NAME} attempt $$n"
      - if [ "$$n" -lt ${PASS_ON} ]; then exit 75; fi
      - echo "${NAME} deployed on attempt $$n"
    signals:
      restart: 75
