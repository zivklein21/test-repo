# EXPECT: cancel: 70 but exit 0 -> everything runs, workflow=success
labels:
  skip78: "true"

when:
  - event: [push, manual]

skip_clone: true

steps:
  describe:
    image: alpine
    environment:
      DESCRIPTION: |
        TEST:     23-cancel-not-triggered
        SIGNALS:  cancel: 70
        EXPECT:   cancel: 70 but exit 0
               -> everything runs, workflow=success
    commands:
      - echo "$${DESCRIPTION}"

  check:
    image: alpine
    commands:
      - echo "inputs ok"
    signals:
      cancel: 70

  deploy:
    image: alpine
    commands:
      - echo "deploy RUNS"
